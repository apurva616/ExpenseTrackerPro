<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | ExpenseTracker Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="logo">
            <h2><i data-lucide="wallet"></i> ExpenseTracker Pro</h2>
            <p>Personal Finance</p>
        </div>
        <nav class="sidebar-menu">
            <a href="/dashboard" class="active">
                <i data-lucide="layout-dashboard"></i> Dashboard
            </a>
            <a href="/expenses-page">
                <i data-lucide="credit-card"></i> Expenses
            </a>
            <a href="/analytics">
                <i data-lucide="bar-chart-2"></i> Analytics
            </a>
            <a href="/budgets">
                <i data-lucide="target"></i> Budgets
            </a>
            <a href="/settings">
                <i data-lucide="settings"></i> Settings
            </a>
            <a href="#" id="logoutBtn">
                <i data-lucide="log-out"></i> Logout
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Welcome Back</h1>
                <p class="welcome-text">
                    Track your spending and stay on budget.
                </p>
            </div>
            <div class="topbar-right">
                <button id="themeToggle" title="Toggle Theme">
                    <i data-lucide="moon"></i>
                </button>
                <div class="user">
                    <i data-lucide="user"></i> {{ user_name }}
                </div>
            </div>
        </header>

        <section class="cards">
            <div class="card total-card">
                <div class="card-icon"><i data-lucide="wallet"></i></div>
                <div>
                    <h3>Total Expenses</h3>
                    <h2 id="totalExpense">₹0.00</h2>
                </div>
            </div>
            <div class="card month-card">
                <div class="card-icon"><i data-lucide="calendar"></i></div>
                <div>
                    <h3>This Month</h3>
                    <h2 id="monthlyExpense">₹0.00</h2>
                </div>
            </div>
            <div class="card category-card">
                <div class="card-icon"><i data-lucide="folder"></i></div>
                <div>
                    <h3>Categories</h3>
                    <h2 id="categoryCount">0</h2>
                </div>
            </div>
        </section>

        <section class="recent-expenses">
            <div class="section-header">
                <h2>Recent Expenses</h2>
                <button id="addExpenseBtn">
                    + Add Expense
                </button>
            </div>
            <div class="chart-card">
                <h2>Expense by Category</h2>
                <canvas id="categoryChart"></canvas>
            </div>
            <div id="expenseList" class="expense-list">
                <div class="loading-card">
                    <div class="loader"></div>
                    <p>Loading expenses...</p>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="{{ url_for('static', filename='js/logout.js') }}"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<script>
    lucide.createIcons();
</script>

</body>

</html>
